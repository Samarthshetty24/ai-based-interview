<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interview Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, sans-serif; }
    .glass-card { background: rgba(17, 24, 39, 0.85); backdrop-filter: blur(14px); border: 1px solid rgba(255, 255, 255, 0.08); }
    .pulse-glow { animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <div class="w-full max-w-4xl glass-card rounded-3xl p-6 md:p-8 shadow-2xl flex flex-col gap-6">

    <!-- Header Orb -->
    <div class="flex flex-col items-center justify-center text-center">
      <div class="w-16 h-16 rounded-full bg-gradient-to-tr from-blue-600 via-indigo-500 to-purple-600 flex items-center justify-center pulse-glow mb-3 shadow-lg shadow-indigo-500/30">
        <i class="fa-solid fa-brain text-2xl text-white"></i>
      </div>
      <h2 id="aiStatus" class="text-xs font-bold text-indigo-400 uppercase tracking-widest">AI Interviewer Ready</h2>
    </div>

    <!-- Question Box -->
    <div class="bg-gray-900/90 border border-gray-800 rounded-2xl p-6 flex flex-col gap-3">
      <div class="flex items-center justify-between">
        <span id="qBadge" class="bg-cyan-950/80 border border-cyan-800/60 text-cyan-400 text-xs px-3.5 py-1 rounded-full font-semibold">
          Question 1 / 5
        </span>
        <span class="bg-emerald-950/80 border border-emerald-800/60 text-emerald-400 text-xs px-3.5 py-1 rounded-full font-semibold flex items-center gap-1.5">
          <i class="fa-solid fa-microchip"></i> Grounded in Your Resume
        </span>
      </div>

      <h1 id="questionText" class="text-lg md:text-xl font-bold text-white leading-relaxed min-h-[80px] flex items-center">
        Click "Begin Interview" below to initialize your personalized technical assessment.
      </h1>
    </div>

    <!-- Answer Box -->
    <div class="flex flex-col gap-2">
      <textarea id="answerInput" rows="4" 
        class="w-full bg-gray-950/90 border border-gray-800 rounded-2xl p-4 text-gray-200 placeholder-gray-500 focus:outline-none focus:border-indigo-500 transition text-sm"
        placeholder="Start speaking (mic will transcribe here) or type your answer directly..."></textarea>
    </div>

    <!-- Controls -->
    <div class="flex gap-3">
      <button id="micBtn" onclick="toggleMic()" class="px-6 py-4 bg-gray-900 hover:bg-gray-800 border border-gray-800 text-gray-200 rounded-2xl font-semibold text-sm transition flex items-center gap-2">
        <i id="micIcon" class="fa-solid fa-microphone text-indigo-400"></i>
        <span id="micLabel">Speak</span>
      </button>

      <button id="actionBtn" onclick="handleAction()" 
        class="flex-1 py-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white rounded-2xl font-bold text-base transition shadow-lg shadow-indigo-600/30 flex items-center justify-center gap-2">
        <span>Begin Interview</span>
      </button>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script>
    let interviewId = null;
    let questionsList = [];
    let currentIndex = 0;
    const totalQuestions = 5;
    let recognition = null;
    let isRecording = false;

    document.addEventListener("DOMContentLoaded", () => {
      if (typeof api !== "undefined") api.requireAuth();
      setupSpeech();
    });

    function setupSpeech() {
      if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        recognition = new SpeechRec();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = "en-US";

        recognition.onresult = (event) => {
          let text = "";
          for (let i = 0; i < event.results.length; i++) {
            text += event.results[i][0].transcript + " ";
          }
          document.getElementById("answerInput").value = text;
        };

        recognition.onerror = () => stopMicUI();
        recognition.onend = () => stopMicUI();
      }
    }

    function toggleMic() {
      if (!recognition) {
        alert("Speech recognition not available. Please type your response.");
        return;
      }
      if (isRecording) {
        recognition.stop();
        stopMicUI();
      } else {
        recognition.start();
        isRecording = true;
        document.getElementById("micIcon").className = "fa-solid fa-microphone-slash text-red-400";
        document.getElementById("micLabel").innerText = "Stop";
        document.getElementById("aiStatus").innerText = "Listening to Candidate...";
      }
    }

    function stopMicUI() {
      isRecording = false;
      document.getElementById("micIcon").className = "fa-solid fa-microphone text-indigo-400";
      document.getElementById("micLabel").innerText = "Speak";
      document.getElementById("aiStatus").innerText = "AI Interviewer Ready";
    }

    function speakText(text) {
      if ("speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.rate = 1.0;
        window.speechSynthesis.speak(utter);
      }
    }

    async function handleAction() {
      const btn = document.getElementById("actionBtn");

      // 1. Start Interview
      if (!interviewId) {
        btn.disabled = true;
        btn.innerText = "Generating Grounded Questions...";
        try {
          const res = await api.request("/interview/start", {
            method: "POST",
            body: JSON.stringify({ role: "Data Scientist" })
          });

          interviewId = res.interview_id || res.id;
          questionsList = res.questions || [];
          currentIndex = 0;

          if (questionsList.length === 0 && res.question) {
            questionsList = [{ id: 1, text: res.question }];
          }

          renderCurrentQuestion();
          btn.disabled = false;
          btn.innerHTML = "<span>Submit Answer</span> <i class='fa-solid fa-arrow-right'></i>";
        } catch (err) {
          alert("Failed to start: " + err.message);
          btn.disabled = false;
          btn.innerText = "Begin Interview";
        }
        return;
      }

      // 2. Submit Answer
      if (isRecording) toggleMic();
      const answer = document.getElementById("answerInput").value.trim();
      const currentQ = questionsList[currentIndex] || {};

      btn.disabled = true;
      btn.innerText = "Saving Answer...";

      try {
        await api.request("/interview/submit-answer", {
          method: "POST",
          body: JSON.stringify({
            interview_id: interviewId,
            question_id: currentQ.id || (currentIndex + 1),
            order: currentIndex + 1,
            question_index: currentIndex + 1,
            answer_text: answer || ""
          })
        });
      } catch (e) {
        console.warn("Save note:", e);
      }

      currentIndex++;

      // 3. Completed Check (Finished 5 Questions)
      if (currentIndex >= totalQuestions || currentIndex >= questionsList.length) {
        document.getElementById("qBadge").innerText = "Completed";
        document.getElementById("questionText").innerText = "Assessment Complete! Generating Performance Report...";
        btn.innerText = "Redirecting to Report...";
        setTimeout(() => {
          window.location.href = `report.html?interview_id=${interviewId}`;
        }, 1000);
        return;
      }

      // 4. Render Next Question
      renderCurrentQuestion();
      document.getElementById("answerInput").value = "";
      btn.disabled = false;
      btn.innerHTML = "<span>Submit Answer</span> <i class='fa-solid fa-arrow-right'></i>";
    }

    function renderCurrentQuestion() {
      const q = questionsList[currentIndex];
      const qText = q ? (q.text || q.question || q.question_text || q) : `Interview Question ${currentIndex + 1}`;
      
      document.getElementById("qBadge").innerText = `Question ${currentIndex + 1} / ${totalQuestions}`;
      document.getElementById("questionText").innerText = qText;
      speakText(qText);
    }
  </script>
</body>
</html>
